<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directions</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="directions-page">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <a href="{% url 'hospital:index' %}" class="logo">🏥Life Saver</a>
                <nav class="nav">
                    <a href="{% url 'hospital:index' %}" class="nav-link">Home</a>
                    <a href="{% url 'hospital:search' %}" class="nav-link">Search</a>
                    <a href="{% url 'hospital:nearby' %}" class="nav-link">Near Me</a>
                </nav>
            </div>
        </header>

        <!-- Map Container -->
        <div class="full-screen-map-container">
            <div id="mapContent" class="map-content">
                <!-- Generated by JavaScript -->
            </div>

            <!-- Navigation Controls -->
            <div class="navigation-controls">
                <button id="startNavBtn" class="btn btn-primary btn-lg" onclick="startNavigation()">
                    🚗 Start Navigation
                </button>
                <button class="btn btn-secondary btn-lg" onclick="goBack()">
                    ← Back
                </button>
            </div>
        </div>
    </div>

    <script src="{% static 'js/script.js' %}"></script>
    <script>
        // Server-rendered directions using `hospital` context
        (function() {
            const hospitalName = "{{ hospital.name|escapejs }}";
            const hospitalAddress = "{{ hospital.address|escapejs }}";

            const mapContent = `
                <div class="directions-container">
                    <div class="map-view" id="mapView">
                        <div class="map-display">
                            <div class="map-grid-background">
                                <div class="route-line"></div>
                                <div class="user-marker">📍 Current Location</div>
                                <div class="destination-marker">🏥 Destination</div>
                            </div>
                        </div>
                    </div>

                    <div class="route-info">
                        <div class="route-header">
                            <h2>${hospitalName}</h2>
                            <p class="route-address">📍 ${hospitalAddress}</p>
                        </div>

                        <div class="route-details">
                            <div class="route-detail-item">
                                <span class="route-label">📏 Distance:</span>
                                <span class="route-value">3.2 km</span>
                            </div>
                            <div class="route-detail-item">
                                <span class="route-label">⏱️ Estimated Time:</span>
                                <span class="route-value">12 minutes</span>
                            </div>
                            <div class="route-detail-item">
                                <span class="route-label">🚗 Route Type:</span>
                                <span class="route-value">Fastest</span>
                            </div>
                        </div>

                        <div class="navigation-instructions">
                            <h3>📋 Turn-by-Turn Directions</h3>
                            <ol class="instruction-list">
                                <li><span class="instruction-number">1</span><span class="instruction-text">Head north on Main Street for 1.2 km</span></li>
                                <li><span class="instruction-number">2</span><span class="instruction-text">Turn right on Health Avenue</span></li>
                                <li><span class="instruction-number">3</span><span class="instruction-text">Continue for 0.8 km</span></li>
                                <li><span class="instruction-number">4</span><span class="instruction-text">Turn left on Medical Plaza Drive</span></li>
                                <li><span class="instruction-number">5</span><span class="instruction-text">Destination on the right - Hospital entrance</span></li>
                            </ol>
                        </div>

                        <div class="emergency-info">
                            <p>⚠️ <strong>Emergency?</strong> Call 911 immediately</p>
                            <p>📞 Hospital Direct: <strong>{{ hospital.phone }}</strong></p>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('mapContent').innerHTML = mapContent;
        })();
    </script>
</body>
</html>
